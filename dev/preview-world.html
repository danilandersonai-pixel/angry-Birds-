<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Фоны и рельеф — предпросмотр</title>
    <style>
      html, body { margin: 0; padding: 0; background: #1d2633; color: #e8eef6; font-family: system-ui, sans-serif; overflow: hidden; }
      #root { padding: 8px; }
      #root.single { padding: 0; }
      .grid { display: grid; grid-template-columns: repeat(3, 590px); gap: 6px; }
      .row { display: flex; gap: 6px; margin-top: 6px; align-items: flex-start; }
      .frame { position: relative; line-height: 0; }
      .frame canvas { display: block; border-radius: 4px; }
      .single .frame canvas { border-radius: 0; }
      .cap { position: absolute; left: 6px; top: 5px; line-height: 1.2; font: 13px "Lilita One", sans-serif; color: #fff;
             text-shadow: 0 1px 2px rgba(0,0,0,.8), 0 0 3px rgba(0,0,0,.6); pointer-events: none; }
      #perf { margin: 0; padding: 8px 10px; font: 11.5px/1.45 ui-monospace, monospace; background: #0f151d; border-radius: 4px;
              white-space: pre; flex: 1; min-height: 314px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dev/preview-world.ts"></script>
  </body>
</html>
