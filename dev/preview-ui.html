<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Интерфейс — предпросмотр</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #0b1a2b;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="scene" role="img" aria-label="Игровое поле"></canvas></div>
    <script type="module" src="/src/dev/preview-ui.ts"></script>
  </body>
</html>
