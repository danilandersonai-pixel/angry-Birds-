<!doctype html><html><head><meta charset="utf-8"></head><body><canvas id=c width=1600 height=900></canvas>
<script src="visual.js"></script>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
function bench(name, fn, n = 30) { fn(); ctx.getImageData(0,0,1,1); const t = performance.now(); for (let i = 0; i < n; i++) { fn(i); ctx.getImageData(0,0,1,1); } return [name, +((performance.now() - t) / n).toFixed(3)]; }
const res = []; res.push(bench('empty flush', () => {}));
const sprites = []; for (let i = 0; i < 12; i++) sprites.push(renderBlock(['wood','ice','stone'][i%3], 'rect', i%2 ? 0.22 : 2.0, i%2 ? 1.7 : 0.22, i%4, i, 72));
res.push(bench('200 block drawImage+rotate', (k) => { for (let i = 0; i < 200; i++) { const s = sprites[i % 12]; ctx.setTransform(1,0,0,1,(i*37)%1600,(i*53)%900); ctx.rotate(i*0.1 + (k||0)*0.01); ctx.drawImage(s, -s.width/2, -s.height/2); } }));
res.push(bench('300 particles arc fill', () => { ctx.setTransform(1,0,0,1,0,0); for (let i = 0; i < 300; i++) { ctx.fillStyle = i%2 ? '#E2C595' : '#C9C5BE'; ctx.beginPath(); ctx.arc((i*37)%1600, (i*53)%900, 6 + i%5, 0, TAU); ctx.fill(); } }));
const dot = makeCanvas(32, 32); { const x = dot.getContext('2d'); x.fillStyle = '#E2C595'; x.beginPath(); x.arc(16,16,15,0,TAU); x.fill(); }
res.push(bench('300 particles drawImage', () => { ctx.setTransform(1,0,0,1,0,0); for (let i = 0; i < 300; i++) { const r = 6 + i%5; ctx.globalAlpha = 0.5 + (i%5)/10; ctx.drawImage(dot, (i*37)%1600 - r, (i*53)%900 - r, 2*r, 2*r); } ctx.globalAlpha = 1; }));
res.push(bench('50 circles shadowBlur=24', () => { ctx.setTransform(1,0,0,1,0,0); ctx.shadowBlur = 24; ctx.shadowColor = 'rgba(255,200,80,0.9)'; for (let i = 0; i < 50; i++) { ctx.fillStyle = '#FFD04A'; ctx.beginPath(); ctx.arc((i*97)%1600, (i*61)%900, 30, 0, TAU); ctx.fill(); } ctx.shadowBlur = 0; ctx.shadowColor = 'transparent'; }));
const glow = glowSprite('#FFD04A', 128);
res.push(bench('50 glow sprites lighter', () => { ctx.setTransform(1,0,0,1,0,0); ctx.globalCompositeOperation = 'lighter'; for (let i = 0; i < 50; i++) ctx.drawImage(glow, (i*97)%1600 - 54, (i*61)%900 - 54, 108, 108); ctx.globalCompositeOperation = 'source-over'; }));
res.push(bench('renderBlock wood 2.0x0.22 @72ppu', (i) => renderBlock('wood', 'rect', 2.0, 0.22, (i||0)%4, i||0, 72), 20));
res.push(bench('renderBlock stone 0.85 @144ppu', (i) => renderBlock('stone', 'rect', 0.85, 0.85, (i||0)%4, i||0, 144), 20));
res.push(bench('renderBlock ice 2.0x0.22 @144ppu', (i) => renderBlock('ice', 'rect', 2.0, 0.22, (i||0)%4, i||0, 144), 20));
res.push(bench('createLinearGradient x100', () => { for (let i = 0; i < 100; i++) { const g = ctx.createLinearGradient(0, 0, 0, 100); g.addColorStop(0, '#fff'); g.addColorStop(1, '#000'); } }));
res.push(bench('fullscreen fillRect multiply', () => { ctx.setTransform(1,0,0,1,0,0); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = '#9AA6D6'; ctx.fillRect(0,0,1600,900); ctx.globalCompositeOperation = 'source-over'; }));
res.push(bench('strokeText+fillText popup x10', () => { ctx.setTransform(1,0,0,1,0,0); ctx.font = '900 48px sans-serif'; ctx.lineWidth = 9; ctx.lineJoin='round'; for (let i = 0; i < 10; i++) { ctx.strokeText('5000', 100 + i*100, 300); ctx.fillText('5000', 100 + i*100, 300); } }));
for (const q of ['low','high']) { ctx.imageSmoothingQuality = q;
 res.push(bench('200 drawImage rotate q='+q, (k) => { for (let i = 0; i < 200; i++) { const s = sprites[i % 12]; ctx.setTransform(1,0,0,1,(i*37)%1600,(i*53)%900); ctx.rotate(i*0.1 + (k||0)*0.01); ctx.drawImage(s, -s.width/2, -s.height/2); } }));
 res.push(bench('200 drawImage no-rotate q='+q, (k) => { ctx.setTransform(1,0,0,1,0,0); for (let i = 0; i < 200; i++) { const s = sprites[i % 12]; ctx.drawImage(s, (i*37)%1600, (i*53)%900); } }));
 res.push(bench('200 drawImage scaled1.1 no-rot q='+q, (k) => { ctx.setTransform(1.1,0,0,1.1,0,0); for (let i = 0; i < 200; i++) { const s = sprites[i % 12]; ctx.drawImage(s, (i*37)%1400, (i*53)%800); } }));
}
ctx.imageSmoothingEnabled = false;
res.push(bench('200 drawImage rotate smoothing OFF', (k) => { for (let i = 0; i < 200; i++) { const s = sprites[i % 12]; ctx.setTransform(1,0,0,1,(i*37)%1600,(i*53)%900); ctx.rotate(i*0.1 + (k||0)*0.01); ctx.drawImage(s, -s.width/2, -s.height/2); } }));
ctx.imageSmoothingEnabled = true;
document.title = 'done'; window.__timing = Object.fromEntries(res); window.__done = true;
</script></body></html>
